<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient for Text & Glow -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="340" rx="16" fill="url(#cyber-grid)" />

  <!-- Subtle Radial Glow in Center/Right -->
  <circle cx="880" cy="170" r="220" fill="#38bdf8" fill-opacity="0.06" filter="url(#glow)" />
  <circle cx="1020" cy="100" r="160" fill="#818cf8" fill-opacity="0.05" filter="url(#glow)" />

  <!-- Decorative Circuit / Hex Column on Right Side -->
  <g opacity="0.35" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="11" fill="#64748b">
    <text x="860" y="70">7F 45 4C 46 02 01 01 00  [ELF64 .text]</text>
    <text x="860" y="95">48 89 E5 48 83 EC 20 48  mov rbp, rsp</text>
    <text x="860" y="120">E8 4B FE FF FF 85 C0 75  call sym.auth</text>
    <text x="860" y="145">CF FA ED FE 01 00 00 0C  [Mach-O ARM64]</text>
    <text x="860" y="170">FD 7B BA A9 F4 4F 01 A9  stp x29, x30</text>
    <text x="860" y="195">FF FF FF F1 00 00 04 08  [Go pclntab 1.20+]</text>
    <text x="860" y="220">65 6E 74 72 6F 70 79 3A  shannon &gt; 7.2</text>
    <text x="860" y="245">53 53 4C 5F 56 45 52 49  SSL_VERIFY_NONE</text>
    <text x="860" y="270">6E 70 78 20 61 73 61 72  ipc::pipe_trace</text>
  </g>

  <!-- Left Accent Vertical Bar -->
  <rect x="50" y="55" width="4" height="230" rx="2" fill="url(#accent-cyan)" />

  <!-- Main Content Container -->
  <g transform="translate(75, 0)">
    <!-- Top Terminal Breadcrumb / Tag -->
    <g transform="translate(0, 75)">
      <rect width="180" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#22c55e" />
      <text x="26" y="17" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">AGENT SKILL • V2.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      reverse-engineering-skill
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Deterministic binary analysis, runtime instrumentation &amp; protocol reversal for AI agents.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 225)">
      <!-- Badge 1: Binaries -->
      <g transform="translate(0, 0)">
        <rect width="145" height="30" rx="6" fill="url(#glow-badge)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="19" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">ELF • PE • Mach-O</text>
      </g>

      <!-- Badge 2: Modern Languages -->
      <g transform="translate(155, 0)">
        <rect width="165" height="30" rx="6" fill="url(#glow-badge)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="19" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="600" fill="#a5b4fc">Go • Rust • WASM • .NET</text>
      </g>

      <!-- Badge 3: Dynamic & Tooling -->
      <g transform="translate(330, 0)">
        <rect width="145" height="30" rx="6" fill="url(#glow-badge)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="19" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="600" fill="#d8b4fe">Frida • Ghidra • MCP</text>
      </g>

      <!-- Badge 4: Clean-room -->
      <g transform="translate(485, 0)">
        <rect width="125" height="30" rx="6" fill="url(#glow-badge)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="19" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11" font-weight="600" fill="#34d399">Clean-Room Spec</text>
      </g>
    </g>

    <!-- Bottom Tech Spec Label -->
    <text x="0" y="285" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="12" fill="#475569">
      &gt; python3 scripts/triage_binary.py &amp;&amp; frida -l hooks.js &amp;&amp; ghidra_headless
    </text>
  </g>

  <!-- Border Outline -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
</svg>
